apiVersion: automation.cloudbees.io/v1alpha1
kind: action
name: 'Policy context check'
description: 'Discover and evaluate all policies applicable to the current workflow context.'

inputs:
  input-data:
    description: Input context data for rule evaluation
    required: false
  input-file:
    description: File containing input context data for rule evaluation
    required: false
  checkpoint-type:
    description: "Checkpoint entity kind: stage, workflow, or job"
    required: false
  checkpoint-name:
    description: Checkpoint entity name (omit when checkpoint-type is workflow)
    required: false
  checkpoint-position:
    description: "Position within the checkpoint: entry, exit, or within"
    required: false
outputs:
  action:
    value: ${{ steps.evaluate.outputs.action }}
    description: "The reconciled action across all evaluated policies"
  details:
    value: ${{ steps.evaluate.outputs.details }}
    description: "Details about evaluation results, including check failures and errors"
  review-channel:
    value: ${{ steps.evaluate.outputs.review-channel }}
    description: "The channel type for review (present only when action=REQUEST_APPROVAL)"
  review-recipients:
    value: ${{ steps.evaluate.outputs.review-recipients }}
    description: "The recipients for review (present only when action=REQUEST_APPROVAL)"
  review-timeout-minutes:
    value: ${{ steps.evaluate.outputs.review-timeout-minutes }}
    description: "The timeout for review (present only when action=REQUEST_APPROVAL)"

runs:
  using: composite
  steps:
    - id: evaluate
      name: Post workflow context to policy service for rule evaluation
      uses: docker://public.ecr.aws/l7o7z1g8/actions/cb-utils:main-0.1.59
      run: |
        INPUT="$INPUT_DATA"
        if [ -n "$INPUT_FILE" ]; then
            INPUT=$(cat "$INPUT_FILE")
        fi

        # Build workflow_request_context payload
        jq -cn \
          --arg comp_id "$COMPONENT" \
          --arg org_id  "$ORG_ID" \
          --arg run_id  "$RUN_ID" \
          --arg cp_type "$CHECKPOINT_TYPE" \
          --arg cp_name "$CHECKPOINT_NAME" \
          --arg cp_pos  "$CHECKPOINT_POSITION" \
          --arg sha     "$SCM_SHA" \
          --arg branch  "$SCM_BRANCH" \
          --arg repo    "$SCM_REPO" \
          '{
            workflow_request_context: {
              component: { id: $comp_id, org_id: $org_id },
              workflow: (({ run_id: $run_id } + (if $cp_type != "" then { checkpoint: (({type: $cp_type} + (if $cp_name != "" then {name: $cp_name} else {} end)) + (if $cp_pos != "" then {position: $cp_pos} else {} end)) } else {} end))),
              artifact: { build: { commit_sha: $sha, branch: $branch, repository: $repo } }
            }
          }' > /tmp/payload.json

        # Merge optional caller-supplied input
        if [ -n "$INPUT" ]; then
            jq --argjson v "$INPUT" '. + {input: $v}' /tmp/payload.json > /tmp/payload_final.json
            mv /tmp/payload_final.json /tmp/payload.json
        fi

        # Make CloudBees Unify API call
        response=$(curl --retry 3 --retry-delay 10 --retry-all-errors --silent --show-error --fail-with-body \
          -X 'POST' "$URL/v3/components/$COMPONENT/policy/evaluate-by-context" \
          -H "Authorization: Bearer $JWT" -H 'Content-Type: application/json' \
          --data-binary '@/tmp/payload.json') || command_failed=1

        if [ ${command_failed:-0} -eq 1 ]; then
          echo "CloudBees Unify API call failed with error: $response"
          exit 1
        fi

        POLICY_ACTION=$(echo "$response" | jq -r .action)

        # Per-policy check failures
        FAILURE_DETAILS=$(echo "$response" | jq -r '
          .results[]? | . as $r |
          .result.failures[]? |
          "Policy \"\($r.policy_name)\" - check \"\(.checkName)\" (rule \"\(.ruleName)\") has not passed"')

        # Top-level errors
        ERROR_DETAILS=$(echo "$response" | jq -r '.errors[]? | "[\(.category)] \(.message)"')

        # Per-policy errors
        PER_POLICY_ERRORS=$(echo "$response" | jq -r '
          .results[]? | . as $r |
          .errors[]? |
          "Policy \"\($r.policy_name)\": [\(.category)] \(.message)"')

        POLICY_DETAILS=$(printf '%s\n%s\n%s' "$FAILURE_DETAILS" "$ERROR_DETAILS" "$PER_POLICY_ERRORS" | sed '/^$/d')

        # Extract review fields (populated when action = REQUEST_APPROVAL)
        REVIEW_CHANNEL=$(echo "$response" | jq -r '.review.channel // ""')
        REVIEW_RECIPIENTS=$(echo "$response" | jq -r '.review.recipients // ""')
        # Default to 4320 (3 days) when timeoutMinutes is absent or zero
        REVIEW_TIMEOUT=$(echo "$response" | jq -r 'if (.review.timeoutMinutes // 0) == 0 then 4320 else .review.timeoutMinutes end')

        # Build per-policy evidence table rows
        EVIDENCE_ROWS=$(echo "$response" | jq -r '
          if (.results | length) == 0 then
            "| _(none discovered)_ | — | — |"
          else
            .results[]? |
            "| \(.policy_name) | \(.action) | \(.result.failures | length) failure(s) |"
          end')

        printf %s "$POLICY_ACTION"    > "$CLOUDBEES_OUTPUTS"/action
        printf %s "$POLICY_DETAILS"   > "$CLOUDBEES_OUTPUTS"/details
        printf %s "$REVIEW_CHANNEL"   > "$CLOUDBEES_OUTPUTS"/review-channel
        printf %s "$REVIEW_RECIPIENTS" > "$CLOUDBEES_OUTPUTS"/review-recipients
        printf %s "$REVIEW_TIMEOUT"   > "$CLOUDBEES_OUTPUTS"/review-timeout-minutes
        printf %s "$EVIDENCE_ROWS"    > "$CLOUDBEES_OUTPUTS"/evidence-rows
      env:
        COMPONENT:           ${{ cloudbees.component.id }}
        ORG_ID:              ${{ cloudbees.org.id }}
        RUN_ID:              ${{ cloudbees.run_id }}
        SCM_SHA:             ${{ cloudbees.scm.sha }}
        SCM_BRANCH:          ${{ cloudbees.scm.branch }}
        SCM_REPO:            ${{ cloudbees.scm.repository }}
        CHECKPOINT_TYPE:     ${{ inputs.checkpoint-type }}
        CHECKPOINT_NAME:     ${{ inputs.checkpoint-name }}
        CHECKPOINT_POSITION: ${{ inputs.checkpoint-position }}
        INPUT_DATA:          ${{ inputs.input-data }}
        INPUT_FILE:          ${{ inputs.input-file }}
        JWT:                 ${{ cloudbees.api.token }}
        URL:                 ${{ cloudbees.api.url }}
    - id: publish-evidence
      name: Publish policy evidence
      uses: cloudbees-io/publish-evidence-item@v1
      with:
        content: |-
          ## Policy Context Evaluation

          | Policy | Action | Failures |
          |--------|--------|----------|
          ${{ steps.evaluate.outputs.evidence-rows }}

          ### Details

          ```
          ${{ steps.evaluate.outputs.details }}
          ```
    - id: enforce
      name: Enforce policy result
      uses: docker://alpine:latest
      shell: sh
      env:
        POLICY_ACTION: ${{ steps.evaluate.outputs.action }}
        POLICY_DETAILS: ${{ steps.evaluate.outputs.details }}
      run: |
        echo "Policy action: $POLICY_ACTION"
        if [ -n "$POLICY_DETAILS" ]; then
          echo "Details:"
          echo "$POLICY_DETAILS"
        fi
        if [ "$POLICY_ACTION" = "ERROR" ]; then
          exit 1
        fi
        if [ "$POLICY_ACTION" = "BLOCK" ]; then
          exit 1
        fi
        echo "Policy check passed"
